version: '3.8'

services:
  food-diary-bot:
    image: ghcr.io/jurisacchetta/food-diary-bot:latest
    container_name: food-diary-bot-prod
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
    volumes:
      - ./data:/app/data
      - ./photos:/app/photos
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  food-diary-admin:
    image: ghcr.io/jurisacchetta/food-diary-bot:latest
    container_name: food-diary-admin-prod
    restart: unless-stopped
    command: python admin.py
    ports:
      - "${ADMIN_PORT:-5000}:5000"
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - ADMIN_HOST=0.0.0.0
      - ADMIN_PORT=5000
      - ADMIN_DEBUG=False
      - DB_PATH=/app/data/food_diary.db
    volumes:
      - ./data:/app/data
      - ./photos:/app/photos
    depends_on:
      - food-diary-bot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.food-diary-bot.service=admin"
